name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser

    runs-on: ${{matrix.os}}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Run Tree-sitter tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: true

          # Can't get this to work for some reason
          # Will run the test independently
          test-node: false

          test-python: true
          test-go: true
          test-swift: ${{ runner.os == 'macOS' }}

        # Running the Node.js tests here
        # The parser-test-action doesn't seem to work
      - name: Run Node.js tests
        run: pnpm test-node

      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: examples/*

      - name: Assert parse gate fails on errors (guard)
        shell: bash
        run: |
          # The examples gate only catches regressions if the grammar still emits
          # ERROR nodes for invalid input. Assert that an (ERROR ...) node is
          # actually present for a deliberately-broken file. Checking for the
          # token (not just a non-zero exit) also fails loudly if tree-sitter is
          # missing/crashes, instead of passing vacuously.
          out=$(tree-sitter parse test/gate-guard/seeded-error.axs 2>&1) || true
          if ! grep -q "ERROR" <<<"$out"; then
            echo "Gate guard FAILED: expected an (ERROR) node for seeded-error.axs; got:" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "Gate guard OK: seeded error correctly produces an (ERROR) node"
